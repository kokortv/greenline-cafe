<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Прайс-лист</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23d32f2f' d='M11 2H13V8H18V21H6V8H11V2Z'/%3E%3C/svg%3E">
<style id="dynamic-styles"></style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --vm-header-bg: #d32f2f;
    --vm-accent: #d32f2f;
    --vm-text: #1a1a1a;
    --vm-bg: #fafafa;
    --vm-border: #e0e0e0;
    --vm-muted: #666;
  }
  [data-theme="dark"] {
    --vm-text: #e0e0e0;
    --vm-bg: #1a1a2e;
    --vm-border: #2a2a4a;
    --vm-muted: #888;
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    color: var(--vm-text);
    background: var(--vm-bg);
    -webkit-tap-highlight-color: transparent;
  }
  /* Boot splash */
  #boot-splash {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--vm-bg);
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    transition: opacity 0.3s ease;
  }
  #boot-splash.done { opacity: 0; pointer-events: none; }
  .boot-spinner {
    width: 38px; height: 38px;
    border: 3px solid var(--vm-border); border-top-color: var(--vm-accent);
    border-radius: 50%; animation: bootSpin 0.9s linear infinite;
  }
  @keyframes bootSpin { to { transform: rotate(360deg); } }
  .boot-text { color: var(--vm-muted); font-size: 0.92rem; }

  /* Header */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 60;
    background: var(--vm-header-bg); color: #fff; padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header h1 { font-size: 1.4rem; margin: 0; }
  .header-spacer { height: 60px; }

  /* Content */
  .content { padding: 12px 16px 40px; max-width: 700px; margin: 0 auto; }
  .empty { text-align: center; color: var(--vm-muted); padding: 40px 0; font-size: 0.95rem; }

  /* Item */
  .item-card {
    background: var(--vm-bg); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    border: 1px solid var(--vm-border);
  }
  .item-name {
    font-weight: 600; font-size: 1rem; word-break: break-word;
  }
  .item-pack {
    font-size: 0.78rem; color: var(--vm-muted); margin-top: 2px;
  }
  .item-price {
    font-size: 1.1rem; font-weight: 700; color: var(--vm-accent); white-space: nowrap;
  }

  /* Error */
  .error-msg { color: #dc2626; text-align: center; padding: 40px 16px; font-size: 0.9rem; }
</style>
</head>
<body>
<div id="boot-splash">
  <div class="boot-spinner"></div>
  <div class="boot-text" id="boot-text">Загрузка прайс-листа…</div>
</div>

<div class="header" id="header" style="visibility:hidden;">
  <h1>Прайс-лист</h1>
</div>
<div class="header-spacer" id="header-spacer" style="visibility:hidden;"></div>

<div class="content" id="content" style="visibility:hidden;">
  <div class="empty">Загрузка...</div>
</div>

<script src="config.js"></script>
<script src="supabase.min.js"></script>
<script>
(function() {
  try {
    if (typeof CONFIG === 'undefined' || !CONFIG.SUPABASE_URL) return;
    var url = CONFIG.SUPABASE_URL;
    if (url.indexOf('PASTE_YOUR') !== -1) return;
    var head = document.head;
    var pc = document.createElement('link');
    pc.rel = 'preconnect'; pc.crossOrigin = 'anonymous'; pc.href = url;
    head.appendChild(pc);
  } catch (e) {}
})();

var _sb = null;

function initSup() {
  if (window.supabase && CONFIG.SUPABASE_URL.indexOf('PASTE_YOUR') === -1) {
    _sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
    });
  }
}

function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getSupplierId() {
  var hash = window.location.hash.replace(/^#/, '');
  if (hash) return hash;
  var params = new URLSearchParams(window.location.search);
  return params.get('supplier') || params.get('id') || '';
}

function getSystemTheme() {
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
  return 'light';
}

async function init() {
  try {
    initSup();
    if (!_sb) throw new Error('Не удалось подключиться к базе данных');

    var supplierId = getSupplierId();
    if (!supplierId) {
      document.getElementById('boot-text').textContent = 'Ссылка недействительна';
      return;
    }

    // Load settings (for color scheme) + user record in parallel
    var results = await Promise.all([
      _sb.from('settings').select('*'),
      _sb.from('users').select('*').eq('id', supplierId).limit(1)
    ]);
    var settingsRows = results[0].data || [];
    var users = results[1].data || [];
    if (results[1].error) throw new Error(results[1].error.message);
    if (!users || users.length === 0) throw new Error('Поставщик не найден');
    var supplier = users[0];
    if (supplier.role !== 'supplier') throw new Error('Доступ запрещён');

    // Apply settings (color scheme)
    var s = {};
    settingsRows.forEach(function(x) { s[x.key] = x.value; });
    var priceColor = s.qr_menu_color_price || '#d32f2f';
    var headerColor = s.qr_menu_color_header || priceColor;
    // Apply dynamic styles
    document.getElementById('dynamic-styles').textContent =
      ':root { --vm-header-bg: ' + headerColor + ' !important; --vm-accent: ' + priceColor + ' !important; } ' +
      '[data-theme="dark"] { --vm-header-bg: ' + headerColor + ' !important; --vm-accent: ' + priceColor + ' !important; }';

    // Apply theme
    document.documentElement.setAttribute('data-theme', getSystemTheme());

    // Get allowed warehouses
    var whIds = String(supplier.allowed_warehouses || '').split(',').map(function(x) { return x.trim(); }).filter(Boolean);
    if (whIds.length === 0) throw new Error('Нет складов');

    // Load deliveries for these warehouses
    var { data: deliveries } = await _sb.from('deliveries').select('*').in('warehouse_id', whIds);
    deliveries = deliveries || [];
    var deliveryIds = deliveries.map(function(d) { return d.id; });

    // Load delivery items
    var allDeliveryItems = [];
    if (deliveryIds.length > 0) {
      var { data: dItems } = await _sb.from('delivery_items').select('*').in('delivery_id', deliveryIds);
      allDeliveryItems = dItems || [];
    }

    // Load writeoffs for these warehouses (to subtract from stock)
    var allWriteoffItems = [];
    var { data: writeoffs } = await _sb.from('writeoffs').select('*').in('warehouse_id', whIds);
    writeoffs = writeoffs || [];
    var wofIds = writeoffs.map(function(w) { return w.id; });
    if (wofIds.length > 0) {
      var { data: wItems } = await _sb.from('writeoff_items').select('*').in('writeoff_id', wofIds);
      allWriteoffItems = wItems || [];
    }

    // Aggregate items by name (case-insensitive)
    var itemsByName = {};
    allDeliveryItems.forEach(function(dit) {
      var name = String(dit.name || '').trim();
      if (!name) return;
      var key = name.toLowerCase();
      if (!itemsByName[key]) {
        itemsByName[key] = {
          name: name,
          qty: 0,
          unit_price: Number(dit.unit_price) || 0,
          markup: Number(dit.markup) || 0,
          pack: dit.pack || ''
        };
      }
      itemsByName[key].qty += Number(dit.quantity) || 0;
      if (Number(dit.unit_price) > 0) itemsByName[key].unit_price = Number(dit.unit_price);
      if (Number(dit.markup) > 0) itemsByName[key].markup = Number(dit.markup);
    });

    // Subtract writeoffs
    allWriteoffItems.forEach(function(wit) {
      var name = String(wit.name || '').trim().toLowerCase();
      if (itemsByName[name]) {
        itemsByName[name].qty -= Number(wit.quantity) || 0;
        if (itemsByName[name].qty < 0) itemsByName[name].qty = 0;
      }
    });

    // Filter: only items with stock > 0
    var items = Object.keys(itemsByName)
      .map(function(k) { return itemsByName[k]; })
      .filter(function(it) { return it.qty > 0; })
      .sort(function(a, b) { return a.name.localeCompare(b.name, 'ru'); });

    // Render items — only name + pack + price with markup
    var contentEl = document.getElementById('content');
    if (items.length === 0) {
      contentEl.innerHTML = '<div class="empty">Нет товаров в наличии</div>';
    } else {
      var html = '';
      items.forEach(function(it) {
        var unitPrice = it.unit_price * (1 + (it.markup || 0) / 100);
        var packInfo = it.pack ? '<div class="item-pack">' + escHtml(it.pack) + '</div>' : '';
        html += '<div class="item-card">' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="item-name">' + escHtml(it.name) + '</div>' +
            packInfo +
          '</div>' +
          '<div class="item-price">' + Math.round(unitPrice) + ' ' + (s.currency || '₾') + '</div>' +
        '</div>';
      });
      contentEl.innerHTML = html;
    }

    // Reveal page
    document.getElementById('header').style.visibility = 'visible';
    document.getElementById('header-spacer').style.visibility = 'visible';
    document.getElementById('content').style.visibility = 'visible';
    var splash = document.getElementById('boot-splash');
    splash.classList.add('done');
    setTimeout(function() { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 320);
  } catch (err) {
    document.getElementById('boot-text').textContent = 'Ошибка: ' + err.message;
    document.getElementById('boot-splash').style.background = '#ffebee';
  }
}

init();
</script>
</body>
</html>
